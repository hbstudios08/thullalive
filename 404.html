<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Thulla Online</title>
  <link rel="canonical" href="https://thulla.live/">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;
      background:linear-gradient(180deg,#12061f,#1d0a33);color:#f6f0ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    a{color:#ff4d6d;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>Opening Thulla&hellip;</h1>
    <p id="msg">If nothing happens, <a href="./">go to the homepage</a>.</p>
  </main>
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
  <script>
    (function () {
      // site root: "/" on thulla.live, "/thullalive/" on hbstudios08.github.io/thullalive/
      var base = /\.github\.io$/.test(location.hostname) ? "/" + (location.pathname.split("/")[1] || "") + "/" : "/";
      document.querySelectorAll("a[href='/']").forEach(function (a) { a.href = base; });
      var code = (new URLSearchParams(location.search).get("code") || "").trim();
      if (/^[A-Za-z0-9_-]{1,32}$/.test(code)) {
        // an invite link that landed here: show the invite page with the room code
        location.replace(base + "join?code=" + encodeURIComponent(code));
      } else if (/\/join\/?$/.test(location.pathname)) {
        location.replace(base);
      } else {
        document.querySelector("h1").textContent = "Page not found";
      }
    })();
  </script>
</body>
</html>
